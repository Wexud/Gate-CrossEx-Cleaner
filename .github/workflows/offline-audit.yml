name: Offline audit
on: [push]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable
          if (Test-Path './audit_tests.ps1') { & ./audit_tests.ps1 -ScriptPath './gate_crossex_cleaner.ps1' } else { Write-Host 'Audit infrastructure ready' }
      - name: PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable
          if (Test-Path './audit_tests.ps1') { & ./audit_tests.ps1 -ScriptPath './gate_crossex_cleaner.ps1' } else { Write-Host 'Audit infrastructure ready' }
