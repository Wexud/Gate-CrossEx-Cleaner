name: Offline audit
on: [push]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 business scenarios
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable
          & ./audit_tests.ps1 -ScriptPath './gate_crossex_cleaner.ps1'
      - name: PowerShell 7 business scenarios
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable
          & ./audit_tests.ps1 -ScriptPath './gate_crossex_cleaner.ps1'
      - name: Windows PowerShell 5.1 native HTTP on loopback
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./audit_transport.ps1 -ScriptPath './gate_crossex_cleaner.ps1'
      - name: PowerShell 7 native HTTP on loopback
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./audit_transport.ps1 -ScriptPath './gate_crossex_cleaner.ps1'
