name: Offline safety audit
on:
  push:
    branches: ['audit/safety-1.0.5']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse and test without Gate access
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "ENGINE: $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)"
          $file = (Resolve-Path './gate_crossex_cleaner.ps1').Path
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List *; throw 'Parser failed' }
          Write-Host 'SYNTAX: PASS'
          Get-FileHash $file -Algorithm SHA256
          if (Test-Path './audit_tests.ps1') {
            & ./audit_tests.ps1 -ScriptPath $file
          } else {
            $Inv = [Globalization.CultureInfo]::InvariantCulture
            $functions = $ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst]}, $false)
            foreach ($fn in $functions) { . ([scriptblock]::Create($fn.Extent.Text)) }
            function Invoke-RestMethod { param($Method,$Uri,$Headers,$Body,$ContentType,$ErrorAction) return ,@() }
            $script:ApiKey = 'OFFLINE-TEST-KEY'
            $script:ApiSecret = 'OFFLINE-TEST-SECRET'
            $ApiHost = 'https://api.gateio.ws'; $Prefix = '/api/v4'
            $rows = @(OpenOrders)
            Write-Host "EMPTY LIST COUNT: $($rows.Count)"
            Write-Host "MISSING NUMBER CONVERTED TO: $(D $null 'missing')"
            Write-Host 'No Gate API requests made. Audit harness is being prepared.'
          }
